name: apple-doc-plugin
label: Apple Developer Documentation
version: 1.1.0
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.5"
author: Andrew Mason <https://github.com/AndrewMason7>
license: MIT
homepage: https://github.com/AndrewMason7/apple-doc-plugin
description: >
  Offline-first Apple Developer Documentation suite for Hermes: 95,899 symbols across
  30 Apple frameworks with sub-5ms SQLite FTS5 search, React/Web/Android-to-SwiftUI idiom
  RRF bridge, automatic Swift compiler diagnostic grounding hook, @apple: context
  references, /apple-docs demo command, and an interactive Hermes Desktop Studio.
tags:
  - apple
  - ios
  - macos
  - visionos
  - swiftui
  - swift
  - documentation
  - desktop
platforms:
  - macos
  - linux
  - windows
desktop_entry: desktop/plugin.js
dashboard_entry: dashboard/manifest.json
optional_env:
  - GEMINI_API_KEY
external_dependencies:
  - name: node
    install_hint: "Optional (Node.js >= 22) for 768-d dense vector hydration; offline SQLite FTS5 + idiom RRF runs natively in Python."
config_schema:
  compiler_grounding:
    type: bool
    default: true
    description: "Automatically append verified Apple DocC replacements when swift build / swiftc / xcodebuild fails."
  prefer_node_bridge:
    type: bool
    default: false
    description: "Route tool calls through the Node.js MCP runtime even when dense vectors are not hydrated."
provides_tools:
  - search_symbols
  - semantic_search
  - get_documentation
  - discover_technologies
  - get_version
  - index_info
provides_hooks:
  - transform_terminal_output

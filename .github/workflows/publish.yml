name: Publish to NPM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: macos-latest
    environment: NPM_TOKEN
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest (npm 11+ for staged publishing)
        run: |
          npm install -g npm@latest
          npm config delete always-auth 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Run package dry-run
        run: ./scripts/publish-dryrun.sh

      - name: Stage or Publish to NPM
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "apple-doc-plugin@${CURRENT_VERSION}" version > /dev/null 2>&1; then
            echo "Version ${CURRENT_VERSION} is already published on npm. Skipping publish step."
          else
            echo "Staging apple-doc-plugin@${CURRENT_VERSION} for publishing (2FA proof-of-presence)..."
            npm stage publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_KEY }}

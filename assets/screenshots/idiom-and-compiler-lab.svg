<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <rect width="1280" height="760" fill="#0B1120"/>
  <text x="48" y="54" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Cross-Framework Idiom Rosetta Stone &amp; Compiler Grounding Lab</text>
  <text x="48" y="82" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Translates React, CSS, and Android mental models into modern Swift 6 APIs + auto-grounds failing swift build runs.</text>

  <rect x="48" y="112" width="576" height="276" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4"/>
  <text x="74" y="148" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">REACT HOOK  →  SWIFTUI LIFECYCLE</text>
  <text x="74" y="180" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="20" font-weight="700">useEffect  →  .task(id:priority:_:)</text>
  <text x="74" y="210" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Structured async task tied to view lifetime; cancelled automatically on disappear.</text>
  <rect x="74" y="232" width="524" height="128" rx="10" fill="#090D16" stroke="#1E293B"/>
  <text x="94" y="266" fill="#C084FC" font-family="ui-monospace, monospace" font-size="14">ProfileView()</text>
  <text x="94" y="292" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="14">    .task(id: userId) {</text>
  <text x="94" y="318" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="14">        await vm.fetchProfile(for: userId)</text>
  <text x="94" y="344" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="14">    }</text>

  <rect x="656" y="112" width="576" height="276" rx="16" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.4"/>
  <text x="682" y="148" fill="#818CF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ANDROID / WEB STORAGE  →  SWIFTDATA &amp; APPSTORAGE</text>
  <text x="682" y="180" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="20" font-weight="700">SharedPreferences / Room  →  @AppStorage &amp; @Model</text>
  <text x="682" y="210" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Zero-boilerplate UserDefaults property wrappers and reactive SwiftData models.</text>
  <rect x="682" y="232" width="524" height="128" rx="10" fill="#090D16" stroke="#1E293B"/>
  <text x="702" y="266" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="14">@AppStorage("theme") private var theme = "dark"</text>
  <text x="702" y="302" fill="#C084FC" font-family="ui-monospace, monospace" font-size="14">@Model final class WorkoutSession {</text>
  <text x="702" y="328" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="14">    var startedAt: Date; var calories: Int</text>
  <text x="702" y="348" fill="#C084FC" font-family="ui-monospace, monospace" font-size="14">}</text>

  <rect x="48" y="416" width="1184" height="296" rx="16" fill="#0F172A" stroke="#34D399" stroke-opacity="0.45"/>
  <text x="74" y="454" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">AUTOMATIC LIFECYCLE HOOK (`transform_terminal_output`)  ·  3.5 ms OFFLINE GROUNDING</text>
  <rect x="74" y="474" width="1132" height="78" rx="10" fill="#090D16" stroke="#334155"/>
  <text x="94" y="504" fill="#F87171" font-family="ui-monospace, monospace" font-size="13">$ swift build  →  ContentView.swift:14:9: warning: 'NavigationView' was deprecated in iOS 16.0</text>
  <text x="94" y="530" fill="#F87171" font-family="ui-monospace, monospace" font-size="13">                  ContentView.swift:22:14: error: value of type 'some View' has no member 'navigationBarItems'</text>

  <rect x="74" y="568" width="1132" height="120" rx="10" fill="#06281E" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="94" y="598" fill="#34D399" font-family="ui-monospace, monospace" font-size="14" font-weight="700">─── [Apple DocC Grounding · Offline 95.9k Index] ───</text>
  <text x="94" y="626" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="13">• `NavigationView` → NavigationStack / NavigationSplitView (/documentation/swiftui/navigationstack)</text>
  <text x="94" y="652" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="13">• `navigationBarItems` → toolbar(content:) + ToolbarItem (/documentation/swiftui/toolbaritem)</text>
  <text x="94" y="676" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">Appended automatically before Hermes reasons over the build failure — eliminating deprecated retry loops.</text>
</svg>

    <rect x="288" y="334" width="186" height="40" rx="10" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.45"/>
    <text x="308" y="359" fill="#E2E8F0">/apple-docs demo</text>

    <rect x="64" y="388" width="224" height="40" rx="10" fill="#1E293B" stroke="#C084FC" stroke-opacity="0.45"/>

  <text x="64" y="264" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20">95,899 offline symbols across 30 Apple frameworks. Zero API keys.</text>
  <text x="64" y="294" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20">React/Android-to-SwiftUI Idiom RRF, Xcode Error Hook &amp; Desktop UI.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">
    <rect x="64" y="334" width="210" height="40" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.45"/>

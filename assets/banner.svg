  <circle cx="180" cy="520" r="240" fill="#818CF8" opacity="0.08"/>

  <rect x="64" y="58" width="248" height="32" rx="16" fill="#1E293B" stroke="#334155"/>
  <text x="84" y="79" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">HERMES NATIVE PLUGIN SUITE</text>

  <text x="64" y="152" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800">Apple Developer</text>
